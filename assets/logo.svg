<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Gradiente Verde Esmeralda -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Azul Petróleo -->
    <linearGradient id="petrolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155E75" />
      <stop offset="60%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#0F4C5C" />
    </linearGradient>

    <!-- Gradiente Amarelo / Laranja Solar -->
    <linearGradient id="amberOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="papagaioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblema Geométrico do Papagaio (Esmeralda, Petróleo e Laranja Solar) -->
  <g transform="translate(12, 8)" filter="url(#papagaioGlow)">
    <!-- Penas da Cauda (Azul Petróleo e Laranja) -->
    <path d="M 24 54 L 14 68 L 28 62 Z" fill="#0F4C5C" />
    <path d="M 28 52 L 20 70 L 34 60 Z" fill="#EA580C" />

    <!-- Corpo do Papagaio (Azul Petróleo Profundo) -->
    <path d="M 32 16 C 44 16 52 26 52 40 C 52 54 42 62 30 62 C 22 62 18 56 18 46 C 18 30 24 16 32 16 Z" fill="url(#petrolGrad)" stroke="#10B981" stroke-width="1.2" />

    <!-- Asa Esmeralda Reluzente -->
    <path d="M 32 26 C 44 28 50 38 48 50 C 44 56 34 58 26 50 C 24 40 28 30 32 26 Z" fill="url(#emeraldGrad)" />

    <!-- Bico (Laranja e Amarelo Solar) -->
    <path d="M 48 24 C 60 26 66 32 64 38 C 58 38 52 32 48 28 Z" fill="url(#amberOrangeGrad)" />
    <path d="M 50 32 C 58 35 60 40 56 42 C 53 40 50 36 50 32 Z" fill="#EA580C" />

    <!-- Olho -->
    <circle cx="43" cy="25" r="4.5" fill="#FFFFFF" />
    <circle cx="44" cy="25" r="2.2" fill="#0F172A" />
    <circle cx="45" cy="24" r="0.8" fill="#FFFFFF" />

    <!-- Crista Tropical (Amarelo e Verde Esmeralda) -->
    <path d="M 34 16 C 36 8 44 6 46 8 C 42 12 40 14 36 16 Z" fill="#FBBF24" />
    <path d="M 30 18 C 30 10 38 8 40 11 C 36 14 33 16 30 18 Z" fill="#10B981" />
  </g>

  <!-- Tipografia: Azul Petróleo e Verde Esmeralda / Amarelo -->
  <text x="88" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0F4C5C" letter-spacing="-0.5">
    Papa<tspan fill="#059669">gaio</tspan>
  </text>
  <text x="90" y="60" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F59E0B" letter-spacing="1.5">
    ANALYTICS • ECOSSISTEMA GAIO
  </text>
</svg>
